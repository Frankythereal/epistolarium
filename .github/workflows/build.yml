name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Android SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms

      - name: APK bauen
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build-Log bei Fehler ablegen
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f build.log
          git commit -m "Build-Log ${{ github.run_number }}"
          git push -f origin build-log

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Epistolarium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Epistolarium
          path: Epistolarium.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Epistolarium 1.0.${{ github.run_number }}
          files: Epistolarium.apk
          make_latest: true
